name: Otterware Release

# Builds Otterware (Otter Code plus Mail, Calendar and Drive) from any branch
# that carries packages/shared/src/otterware.ts, and attaches the builds to this
# run and to a DRAFT prerelease tagged otterware-v<version>. Nothing here
# publishes: no npm, no Cloudflare, no relay, no update manifests, no published
# GitHub release. Drafts have no git tag and are invisible to electron-updater
# and to the runtime installer, which also only follow v<version> tags, so no
# Otter Code install can ever be offered an Otterware build.
#
# Optional configuration (the build passes it through when set, never fails without it):
#   vars.OTTER_MAIL_GOOGLE_CLIENT_ID    secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET
#   vars.T3CODE_GOOGLE_CLIENT_ID        secrets.T3CODE_GOOGLE_CLIENT_SECRET
#   secrets.CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
#   and vars.APPLE_TEAM_ID sign and notarize the macOS app; without them it is signed ad hoc.

on:
  # A manual run needs this file on the default branch. Until Otterware lands
  # there, start a build by pushing a tag from the branch:
  #   git tag otterware-build-<anything> && git push origin otterware-build-<anything>
  push:
    tags:
      - "otterware-build-*"
  workflow_dispatch:
    inputs:
      mac:
        description: "Also build macOS arm64 (dmg + zip)"
        type: boolean
        default: true

concurrency:
  group: otterware-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # release-desktop.yml reads this run's artifact list.
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ github.sha }}
      accounts_url: ${{ steps.meta.outputs.accounts_url }}
      accounts_cli_client_id: ${{ steps.meta.outputs.accounts_cli_client_id }}
      relay_url: ${{ steps.meta.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      # <core>-otterware.<yyyymmdd>.<run>, with the core Otter Code's next
      # nightly uses. No Otter Code channel pattern matches it.
      - id: meta
        name: Resolve Otterware version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          ACCOUNTS_URL: ${{ vars.ACCOUNTS_URL }}
          ACCOUNTS_CLI_CLIENT_ID: ${{ vars.ACCOUNTS_CLI_CLIENT_ID }}
          RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
        run: |
          set -euo pipefail
          if [[ ! -e packages/shared/src/otterware.ts ]]; then
            echo "::error::${GITHUB_REF_NAME} is not an Otterware branch (packages/shared/src/otterware.ts is missing). Otter Code is released by release.yml."
            exit 1
          fi
          base="$(node -p 'require("./apps/desktop/package.json").version')"
          core="${base%%[-+]*}"
          IFS=. read -r major minor patch <<<"$core"
          date="$(date -u +%Y%m%d)"
          version="${major}.${minor}.$((patch + 1))-otterware.${date}.${RUN_NUMBER}"
          node --input-type=module -e '
            import { isOtterwareVersion } from "./packages/shared/src/otterware.ts";
            if (!isOtterwareVersion(process.argv[1])) {
              console.error(`Not an Otterware version: ${process.argv[1]}`);
              process.exit(1);
            }
          ' "$version"
          {
            echo "version=$version"
            echo "tag=otterware-v$version"
            echo "accounts_url=${ACCOUNTS_URL:-https://accounts.otterware.app/v1/auth}"
            echo "accounts_cli_client_id=${ACCOUNTS_CLI_CLIENT_ID:-otter-code-cli}"
            echo "relay_url=https://${RELAY_DOMAIN:-relay.code.otterware.app}"
          } >> "$GITHUB_OUTPUT"
          echo "### Otterware $version" >> "$GITHUB_STEP_SUMMARY"

  # Same as release.yml's build_bundle, without the relay tracing config.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_ACCOUNTS_URL: ${{ needs.preflight.outputs.accounts_url }}
      T3CODE_ACCOUNTS_CLI_CLIENT_ID: ${{ needs.preflight.outputs.accounts_cli_client_id }}
      T3CODE_RELAY_URL: ${{ needs.preflight.outputs.relay_url }}
      OTTER_MAIL_GOOGLE_CLIENT_ID: ${{ vars.OTTER_MAIL_GOOGLE_CLIENT_ID }}
      OTTER_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET }}
      T3CODE_GOOGLE_CLIENT_ID: ${{ vars.T3CODE_GOOGLE_CLIENT_ID }}
      T3CODE_GOOGLE_CLIENT_SECRET: ${{ secrets.T3CODE_GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts... --filter=@otter-mail/web... --filter=@otter-mail/core...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      # release-desktop.yml downloads this by name into `apps`.
      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Linux x64 AppImage + .deb, and the Linux x64 server runtime archive
  # (cli-linux-x64) that scripts/otterware/fleet-server.sh installs.
  # release_channel "preview" makes release-desktop.yml leave out blockmaps
  # and updater manifests; Otterware builds have no update feed either way.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: preview
      relay_client_tracing: false
      accounts_url: ${{ needs.preflight.outputs.accounts_url }}
      accounts_cli_client_id: ${{ needs.preflight.outputs.accounts_cli_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  # Signed and notarized with the Otter Code Developer ID when the Apple
  # secrets are present, ad hoc otherwise. macOS jobs run on macos-15 (OTTER.md).
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    if: ${{ github.event_name == 'push' || inputs.mac }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: preview
      relay_client_tracing: false
      accounts_url: ${{ needs.preflight.outputs.accounts_url }}
      accounts_cli_client_id: ${{ needs.preflight.outputs.accounts_cli_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false

  draft_release:
    name: Draft GitHub release
    needs: [preflight, desktop_linux_x64, desktop_mac_arm64]
    if: ${{ !cancelled() && needs.desktop_linux_x64.result == 'success' && (needs.desktop_mac_arm64.result == 'success' || needs.desktop_mac_arm64.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      TARGET_SHA: ${{ needs.preflight.outputs.ref }}
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: "{desktop-*,cli-linux-x64}"
          path: downloads

      # SHA256SUMS lets a fleet machine verify the runtime archive the same
      # way the runtime installer verifies an Otter Code release.
      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          find downloads -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name 't3-*.tar.gz' \) \
            -exec cp {} assets/ \;
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS
          {
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Otterware bundle
        uses: actions/upload-artifact@v7
        with:
          name: otterware-${{ needs.preflight.outputs.version }}
          path: assets/*
          if-no-files-found: error

      - name: Create or update draft release
        shell: bash
        run: |
          set -euo pipefail
          notes="Otterware preview build of ${TARGET_SHA} from ${GITHUB_REF_NAME} (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Draft only: never publish this release. Otterware has no automatic updates; install new builds from the run or this draft.

          - Linux: Otterware-${VERSION}-x86_64.AppImage or the .deb
          - macOS: Otterware-${VERSION}-arm64.dmg
          - Fleet server runtime: t3-${VERSION}-linux-x64.tar.gz, installed with scripts/otterware/fleet-server.sh"
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "::error::$TAG exists and is published. Otterware releases must stay drafts; unpublish it by hand."
              exit 1
            fi
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --prerelease \
              --latest=false \
              --target "$TARGET_SHA" \
              --title "Otterware $VERSION" \
              --notes "$notes"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) \(.url)"'
