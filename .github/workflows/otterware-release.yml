name: Otterware Release

# Publishes immutable Otterware builds and rolling per-branch feeds in the
# separate public otterware-app/otterware-releases repository. Otter Code's
# release repository/feed is never written here. Legacy tags use otterware;
# explicit tags: otterware-build-channel-<channel>--<build-id>.
#
# Optional module OAuth configuration:
#   vars.OTTER_MAIL_GOOGLE_CLIENT_ID    secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET
#   vars.OTTER_MAIL_MICROSOFT_CLIENT_ID (optional public Outlook client)
#   vars.T3CODE_GOOGLE_CLIENT_ID        secrets.T3CODE_GOOGLE_CLIENT_SECRET
#   secrets.CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
# macOS channel builds require the Apple signing secrets and vars.APPLE_TEAM_ID.

on:
  # A manual run needs this file on the default branch. Until Otterware lands
  # there, start a build by pushing a tag from the branch:
  #   git tag otterware-build-<anything> && git push origin otterware-build-<anything>
  push:
    tags:
      - "otterware-build-*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Branch/channel to follow (empty uses the selected branch)"
        type: string
        default: ""
      mac:
        description: "Also build macOS arm64 (dmg + zip)"
        type: boolean
        default: true

concurrency:
  group: otterware-release-publishing
  cancel-in-progress: false

permissions:
  # release-desktop.yml reads this run's artifact list.
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      ref: ${{ github.sha }}
      accounts_url: ${{ steps.meta.outputs.accounts_url }}
      accounts_cli_client_id: ${{ steps.meta.outputs.accounts_cli_client_id }}
      relay_url: ${{ steps.meta.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      # <core>-otterware.<yyyymmdd>.<run>, with the core Otter Code's next
      # nightly uses. No Otter Code channel pattern matches it.
      - id: meta
        name: Resolve Otterware version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          DISPATCH_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (inputs.channel || github.ref_name) || '' }}
          ACCOUNTS_URL: ${{ vars.ACCOUNTS_URL }}
          ACCOUNTS_CLI_CLIENT_ID: ${{ vars.ACCOUNTS_CLI_CLIENT_ID }}
          RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
        run: |
          set -euo pipefail
          if [[ ! -e packages/shared/src/otterware.ts ]]; then
            echo "::error::${GITHUB_REF_NAME} is not an Otterware branch (packages/shared/src/otterware.ts is missing). Otter Code is released by release.yml."
            exit 1
          fi
          channel="$(node --input-type=module -e '
            import { resolveOtterwareBuildChannel } from "./packages/shared/src/otterware.ts";
            console.log(resolveOtterwareBuildChannel(process.env.GITHUB_REF_NAME, process.env.DISPATCH_BRANCH));
          ')"
          base="$(node -p 'require("./apps/desktop/package.json").version')"
          core="${base%%[-+]*}"
          IFS=. read -r major minor patch <<<"$core"
          date="$(date -u +%Y%m%d)"
          version="${major}.${minor}.$((patch + 1))-otterware.${date}.${RUN_NUMBER}"
          node --input-type=module -e '
            import { isOtterwareVersion } from "./packages/shared/src/otterware.ts";
            if (!isOtterwareVersion(process.argv[1])) {
              console.error(`Not an Otterware version: ${process.argv[1]}`);
              process.exit(1);
            }
          ' "$version"
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=otterware-v$version"
            echo "accounts_url=${ACCOUNTS_URL:-https://accounts.otterware.app/v1/auth}"
            echo "accounts_cli_client_id=${ACCOUNTS_CLI_CLIENT_ID:-otter-code-cli}"
            echo "relay_url=https://${RELAY_DOMAIN:-relay.code.otterware.app}"
          } >> "$GITHUB_OUTPUT"
          echo "### Otterware $version" >> "$GITHUB_STEP_SUMMARY"

  # Same as release.yml's build_bundle, without the relay tracing config.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_ACCOUNTS_URL: ${{ needs.preflight.outputs.accounts_url }}
      T3CODE_ACCOUNTS_CLI_CLIENT_ID: ${{ needs.preflight.outputs.accounts_cli_client_id }}
      T3CODE_RELAY_URL: ${{ needs.preflight.outputs.relay_url }}
      OTTER_MAIL_GOOGLE_CLIENT_ID: ${{ vars.OTTER_MAIL_GOOGLE_CLIENT_ID }}
      OTTER_MAIL_MICROSOFT_CLIENT_ID: ${{ vars.OTTER_MAIL_MICROSOFT_CLIENT_ID }}
      OTTER_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET }}
      T3CODE_GOOGLE_CLIENT_ID: ${{ vars.T3CODE_GOOGLE_CLIENT_ID }}
      T3CODE_GOOGLE_CLIENT_SECRET: ${{ secrets.T3CODE_GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts... --filter=@otter-mail/web... --filter=@otter-mail/core...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Final integrated typecheck
        env:
          GOMAXPROCS: "2"
          GOMEMLIMIT: 5GiB
        run: |
          set -euo pipefail
          for package in @t3tools/contracts @t3tools/shared @t3tools/client-runtime t3 @t3tools/web @t3tools/desktop @t3tools/scripts; do
            vp run --filter="$package" typecheck
          done
          vp exec --filter t3 -- tsc -p src/suite/mail/worker/tsconfig.json

      - name: Verify integrated modules and shared data home
        run: vp test run apps/server/src/suite/SuiteServer.test.ts apps/server/src/suite/calendar/CalendarModule.test.ts apps/server/src/suite/mail/MailModule.test.ts apps/server/src/suite/mail/worker/buildMailWorker.test.ts apps/server/src/suite/StateDirGuard.test.ts apps/desktop/src/app/OtterwarePaths.test.ts apps/desktop/src/suite/mail/DesktopFrame.test.ts apps/web/src/suite/mail/mailGoogleAuth.test.ts apps/web/src/suite/calendar/upstreamShims/commandPaletteLogic.test.ts scripts/lib/cli-external-packages.test.ts scripts/lib/drive-runtime-packaging.test.ts --maxWorkers=1

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Smoke-test server dependency roots
        run: vp exec --filter t3 -- node dist/bin.mjs serve --help > /dev/null

      # release-desktop.yml downloads this by name into `apps`.
      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Linux x64 AppImage + .deb, and the Linux x64 server runtime archive
  # (cli-linux-x64) that scripts/otterware/fleet-server.sh installs.
  # The generic feed uses latest files inside a separate URL for each branch.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: latest
      otterware_update_channel: ${{ needs.preflight.outputs.channel }}
      relay_client_tracing: false
      accounts_url: ${{ needs.preflight.outputs.accounts_url }}
      accounts_cli_client_id: ${{ needs.preflight.outputs.accounts_cli_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  # Signed and notarized with the Otter Code Developer ID when the Apple
  # secrets are present, ad hoc otherwise. macOS jobs run on macos-15 (OTTER.md).
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    if: ${{ github.event_name == 'push' || inputs.mac }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: latest
      otterware_update_channel: ${{ needs.preflight.outputs.channel }}
      relay_client_tracing: false
      accounts_url: ${{ needs.preflight.outputs.accounts_url }}
      accounts_cli_client_id: ${{ needs.preflight.outputs.accounts_cli_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false

  publish_release:
    name: Publish Otterware and channel feed
    needs: [preflight, desktop_linux_x64, desktop_mac_arm64]
    if: ${{ !cancelled() && needs.desktop_linux_x64.result == 'success' && (needs.desktop_mac_arm64.result == 'success' || needs.desktop_mac_arm64.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      SOURCE_SHA: ${{ needs.preflight.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          # Same checkout as the other jobs. The gitlinks under .repos/ have no
          # .gitmodules entry; persist-credentials: false would run a submodule
          # credential cleanup that fails on them.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Mint release repository token
        id: release_token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: otterware-app
          repositories: otterware-releases
          permission-contents: write

      - name: Require release app installation
        if: ${{ steps.release_token.outcome != 'success' }}
        run: |
          echo "::error::Install the release app on otterware-app/otterware-releases with Contents write permission; configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY."
          exit 1

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: "{desktop-*,cli-linux-x64}"
          path: downloads

      - name: Collect assets and checksums
        shell: bash
        env:
          EXPECT_MAC: ${{ needs.desktop_mac_arm64.result == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p assets
          find downloads -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name 't3-*.tar.gz' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} assets/ \;
          test -s assets/latest-linux.yml
          if [[ "$EXPECT_MAC" == "true" ]]; then
            test -s assets/latest-mac.yml
            test -s "assets/Otterware-${VERSION}-arm64.zip"
            test -s "assets/Otterware-${VERSION}-arm64.dmg"
          fi
          (cd assets && sha256sum -- * > SHA256SUMS)

      - name: Upload Otterware bundle
        uses: actions/upload-artifact@v7
        with:
          name: otterware-${{ needs.preflight.outputs.version }}
          path: assets/*
          if-no-files-found: error

      - name: Publish immutable build and rolling feed
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: bash scripts/otterware/publish-release.sh assets
